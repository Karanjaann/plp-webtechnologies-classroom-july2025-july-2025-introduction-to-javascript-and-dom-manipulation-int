<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Fundamentals Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>JavaScript Fundamentals Demo</h1>

  <!-- Part 1: Input and Conditional -->
  <div>
    <label for="ageInput">Enter your age: </label>
    <input type="number" id="ageInput">
    <button onclick="checkAge()">Check Eligibility</button>
    <p id="ageResult"></p>
  </div>

  <!-- Part 2 & 3: Functions and Loops -->
  <div>
    <button onclick="showNumbers()">Show Numbers 1–10</button>
    <ul id="numberList"></ul>
  </div>

  <div>
    <button onclick="calculateTotal()">Calculate Cart Total</button>
    <p id="cartTotal"></p>
  </div>

  <!-- Part 4: DOM Interactions -->
  <div>
    <button id="toggleBtn">Toggle Message</button>
    <p id="toggleMessage" style="display:none;"> You toggled me!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
